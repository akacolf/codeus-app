name: Release

# Packages QC Codeus for macOS / Windows / Linux and attaches the installers
# plus the electron-updater manifests (latest*.yml) to a GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Builds are UNSIGNED (no Apple / Windows code-signing certs).
# CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from hunting for a
# macOS identity and failing the job. Consequences: macOS warns on first launch
# (right-click → Open) and its in-app updater is detect-only; Windows SmartScreen
# warns until reputation builds but NSIS auto-update works; Linux is unaffected.
#
# Releases upload as a DRAFT — review it, then click "Publish release". Only a
# published, non-prerelease release becomes `releases/latest`, which is what the
# website download proxy (quantumclub.sh/codeus/dl/<file>) and the in-app
# electron-updater both read. Publishing is therefore the gate that pushes an
# update out to clients.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_cmd: bun run build:mac
            artifacts: |
              dist/*.dmg
              dist/*-mac.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: windows-latest
            build_cmd: bun run build:win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            build_cmd: bun run build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.artifacts }}

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: qc-codeus-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: ignore
